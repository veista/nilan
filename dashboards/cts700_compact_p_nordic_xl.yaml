title: Nilan CTS700 Nordic XL
views:
  - title: Nordic XL
    path: nilan-nordic
    type: sections
    max_columns: 2
    dense_section_placement: true
    sections:
      - type: grid
        cards:
          - type: markdown
            content: |
              ## Nilan CTS700 Compact P Nordic XL
              Fan step on 4747 may be 101-104 or percent (mapped to steps 1-4). Entities from
              the Nilan integration only (example device name **Nilan CTS700 Nordic**).
              Search-replace `nilan_cts700_nordic_` if your device name differs.
              HVAC **heating** follows compressor effort 4706 (hysteresis), not mode alone.
              Bypass is **status only** over Ethernet. Week programs are not synced.
          - type: thermostat
            entity: climate.nilan_cts700_nordic_hvac
          - type: entities
            title: Climate and air quality
            entities:
              - climate.nilan_cts700_nordic_hvac
              - sensor.nilan_cts700_nordic_control_state
              - sensor.nilan_cts700_nordic_humidity
              - sensor.nilan_cts700_nordic_24h_average_humidity
              - sensor.nilan_cts700_nordic_days_to_inlet_filter_change
              - sensor.nilan_cts700_nordic_days_to_exhaust_filter_change
              - binary_sensor.nilan_cts700_nordic_filter_alarm
              - binary_sensor.nilan_cts700_nordic_bypass_flap
              - sensor.nilan_cts700_nordic_bypass_damper_percent
              - binary_sensor.nilan_cts700_nordic_heat_pump
              - sensor.nilan_cts700_nordic_main_compressor_effort
              - sensor.nilan_cts700_nordic_fan_speed_percent
              - sensor.nilan_cts700_nordic_supply_fan_speed
              - sensor.nilan_cts700_nordic_return_fan_speed
              - sensor.nilan_cts700_nordic_anode_state
      - type: grid
        cards:
          - type: entities
            title: Temperatures
            entities:
              - sensor.nilan_cts700_nordic_fresh_air_intake_temperature_t1
              - sensor.nilan_cts700_nordic_supply_air_temperature_t2
              - sensor.nilan_cts700_nordic_return_air_temperature_t3
              - sensor.nilan_cts700_nordic_waste_air_temperature_t4
              - sensor.nilan_cts700_nordic_condenser_temperature_t5
              - sensor.nilan_cts700_nordic_waste_air_temperature_t6
              - sensor.nilan_cts700_nordic_fresh_air_intake_temperature_t8
          - type: entities
            title: Domestic hot water
            entities:
              - water_heater.nilan_cts700_nordic_top_water_heater
              - water_heater.nilan_cts700_nordic_bottom_water_heater
              - switch.nilan_cts700_nordic_electrical_supplement_heater
              - number.nilan_cts700_nordic_scalding_protection_setpoint
              - number.nilan_cts700_nordic_el_supplement_activated_below
              - switch.nilan_cts700_nordic_hot_water_production_pause
              - number.nilan_cts700_nordic_hot_water_pause_days
              - switch.nilan_cts700_nordic_automatic_anti_legionella
              - select.nilan_cts700_nordic_legionella_day
          - type: entities
            title: Ventilation and Polar
            entities:
              - switch.nilan_cts700_nordic_ventilation_pause
              - switch.nilan_cts700_nordic_allow_active_cooling
              - switch.nilan_cts700_nordic_frost_protection
              - number.nilan_cts700_nordic_frost_protection_below
              - number.nilan_cts700_nordic_preheater_setpoint
              - number.nilan_cts700_nordic_low_humidity_level
              - select.nilan_cts700_nordic_low_humidity_ventilation_level
              - select.nilan_cts700_nordic_high_humidity_ventilation_level
          - type: markdown
            content: |
              DHW: tank temperature is water heater **current**, not the Ethernet dial
              (often capped near 25.5 C). See docs/cts700/ethernet-limits.md.
              Heating action tracks compressor effort (hysteresis), not a continuous mode band.
          - type: history-graph
            title: Room and outdoor
            hours_to_show: 24
            entities:
              - climate.nilan_cts700_nordic_hvac
              - sensor.nilan_cts700_nordic_fresh_air_intake_temperature_t1
